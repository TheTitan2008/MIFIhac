[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-radar"
version = "0.1.0"
description = "Offline evidence-first batch vertical slice for the KROK case"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.4.3",
  "streamlit==1.54.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
